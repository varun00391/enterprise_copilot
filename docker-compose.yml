services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orgmind_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://orgmind:orgmind_secret@postgres:5432/orgmind
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-orgmind_minio}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-orgmind_minio_secret}
      - MINIO_BUCKET=${MINIO_BUCKET:-orgmind-documents}
      # Phase 2 additions
      # OAuth: SPA origin used for landing after Google login; redirect URI defaults to nginx /api path
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-http://localhost:3000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/auth/google/callback}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - DEEPGRAM_STT_MODEL=${DEEPGRAM_STT_MODEL:-nova-3}
      - DEEPGRAM_TTS_MODEL=${DEEPGRAM_TTS_MODEL:-aura-2}
      - DEEPGRAM_TTS_VOICE=${DEEPGRAM_TTS_VOICE:-aura-asteria-en}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_STT_MODEL=${GROQ_STT_MODEL:-whisper-large-v3-turbo}
      - GROQ_VISION_MODEL=${GROQ_VISION_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
      - PLAYWRIGHT_HEADLESS=${PLAYWRIGHT_HEADLESS:-true}
      - CRAWL_MAX_DEPTH=${CRAWL_MAX_DEPTH:-1}
      - CRAWL_MAX_PAGES_PER_URL=${CRAWL_MAX_PAGES_PER_URL:-10}
      - DOCUMENT_FRESHNESS_THRESHOLD_DAYS=${DOCUMENT_FRESHNESS_THRESHOLD_DAYS:-90}
      - COVERAGE_GAP_CONFIDENCE_THRESHOLD=${COVERAGE_GAP_CONFIDENCE_THRESHOLD:-0.5}
      # Phase 3: Knowledge graph (Neo4j) + Graph RAG — set GRAPH_RAG_ENABLED=true when Neo4j is up
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-orgmind_graph_secret}
      - GRAPH_RAG_ENABLED=${GRAPH_RAG_ENABLED:-false}
      - GRAPH_BUILD_ON_INGEST=${GRAPH_BUILD_ON_INGEST:-true}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
      neo4j:
        condition: service_started
    volumes:
      - ./backend:/app
    networks:
      - orgmind_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orgmind_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - orgmind_net
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: orgmind_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: orgmind
      POSTGRES_PASSWORD: orgmind_secret
      POSTGRES_DB: orgmind
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - orgmind_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orgmind -d orgmind"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: orgmind_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - orgmind_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: orgmind_redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - orgmind_net
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: orgmind_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-orgmind_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-orgmind_minio_secret}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - orgmind_net
    restart: unless-stopped

  neo4j:
    image: neo4j:5.19-community
    container_name: orgmind_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/orgmind_graph_secret
    volumes:
      - neo4j_data:/data
    networks:
      - orgmind_net
    restart: unless-stopped

  # Phase 2: Playwright for web crawl (headless Chromium)
  playwright:
    image: mcr.microsoft.com/playwright/python:v1.47.0-jammy
    container_name: orgmind_playwright
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app
    command: python -c "print('Playwright container ready')"
    depends_on:
      - backend
    networks:
      - orgmind_net
    restart: "no"

volumes:
  pg_data:
  qdrant_storage:
  redis_data:
  minio_data:
  neo4j_data:

networks:
  orgmind_net:
    driver: bridge
